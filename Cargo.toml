[workspace]
members = ["crates/filter-core", "crates/filter-gpu", "crates/filter-io", "crates/filter-app"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
filter-core = { path = "crates/filter-core" }
filter-gpu = { path = "crates/filter-gpu" }
filter-io = { path = "crates/filter-io" }
anyhow = "1"
half = { version = "2.7", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
wgpu = "30"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "wgpu", "persistence", "wayland", "x11"] }
egui-wgpu = "0.37"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "tiff"] }
moxcms = { version = "0.9.2", features = ["extended_range"] }
rfd = "0.18"
pollster = "0.4"
png = "0.18"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
rayon = "1.11"
libc = "0.2"
kamadak-exif = "0.6.1"
