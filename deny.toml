# Baseline for the current locked dependency graph. Unlisted licenses fail CI.
[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]

# egui's bundled fonts carry additional licenses alongside its Rust code.
[[licenses.exceptions]]
name = "epaint_default_fonts"
allow = ["OFL-1.1", "Ubuntu-font-1.0"]

[bans]
# Transitive GUI/GPU dependencies currently require multiple crate versions.
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
