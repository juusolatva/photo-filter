name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUST_BACKTRACE: "1"

jobs:
  test:
    name: Test (${{ matrix.os }}, ${{ matrix.backend }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            backend: vulkan
          - os: windows-2025
            backend: dx12
    env:
      WGPU_BACKEND: ${{ matrix.backend }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy --component rustfmt

      - name: Select stable Rust
        run: rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies and configure lavapipe
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers
          install -d -m 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
          lavapipe_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${lavapipe_icds[0]}"
          echo "VK_DRIVER_FILES=${lavapipe_icds[0]}" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Check Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace --locked

      # Ignored tests require a software adapter and fail if absent.
      # Run serially to bound memory/device pressure. Check viewport regressions
      # before the expensive 36.6MP fixture so failures surface promptly.
      # Windows uses its built-in DX12 WARP adapter; Linux uses the ICD above.
      - name: Run software-GPU tests
        run: cargo test --workspace --locked -- --ignored --skip large_image_exports --test-threads=1 --nocapture

      - name: Run large-image export regression
        run: cargo test -p filter-app --locked large_image_exports -- --ignored --test-threads=1 --nocapture

  # cargo-llvm-cov runs the ordinary and ignored software-GPU tests on lavapipe
  # for coverage. Only the matrix above runs the large-image export regression.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Fork and Dependabot PRs have no repository secrets; still run coverage.
      SONAR_ANALYSIS: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy,llvm-tools-preview --no-self-update
          rustup default stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies and configure lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libx11-dev libxrandr-dev \
            libxi-dev libxcursor-dev libxinerama-dev libegl1-mesa-dev \
            libvulkan1 mesa-vulkan-drivers
          install -d -m 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"
          lavapipe_icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test -f "${lavapipe_icds[0]}"
          echo "VK_DRIVER_FILES=${lavapipe_icds[0]}" >> "$GITHUB_ENV"

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-llvm-cov@0.9.1
          fallback: none

      # Include the software-GPU regressions so GPU code is measured; they fail
      # rather than skip without lavapipe. The large-image export regression
      # stays in the test matrix because instrumentation makes it too slow.
      - name: Generate coverage report
        env:
          WGPU_BACKEND: vulkan
        run: >-
          cargo llvm-cov --workspace --all-features --locked --lcov --output-path lcov.info
          -- --include-ignored --skip large_image_exports --test-threads=1

      - name: Get the week for the SonarQube cache key
        id: week
        if: env.SONAR_ANALYSIS == 'true'
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Rotate weekly without restore-keys so cached plugins/JRE are refreshed.
      # Only main saves caches; PRs can reuse its matching weekly entry.
      - name: Restore SonarQube packages
        id: sonar-cache
        if: env.SONAR_ANALYSIS == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sonar-${{ steps.week.outputs.week }}

      - name: SonarQube Scan
        if: env.SONAR_ANALYSIS == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          # Command-line properties override the checked-out project configuration.
          args: >-
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.rust.lcov.reportPaths=${{ github.workspace }}/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Save SonarQube packages
        if: env.SONAR_ANALYSIS == 'true' && github.ref == 'refs/heads/main' && steps.sonar-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-${{ runner.arch }}-sonar-${{ steps.week.outputs.week }}
